# Profile and site identity. Restart Jekyll after changing this file.
name: &author_name Yiming Xu
title: "Yiming Xu's Homepage"
description: "Yiming Xu is a Postdoctoral Research Scientist at Columbia University studying transportation AI, travel behavior, digital twins, and street safety."
url: https://xuyimingxym.github.io
baseurl: ""
repository: xuyimingxym/xuyimingxym.github.io
locale: en-US
timezone: Etc/UTC

author:
  name: *author_name
  alternate_name: 徐一鸣
  bio: Postdoctoral Research Scientist
  department: Department of Civil Engineering and Engineering Mechanics
  employer: Columbia University
  location: New York, NY
  avatar: profile.png
  cv: /files/Yiming_Xu_s_CV_C.pdf
  email: yx3130@columbia.edu
  googlescholar: "https://scholar.google.com/citations?user=sQfzouEAAAAJ&hl=en"
  orcid: https://orcid.org/0000-0002-2983-1751
  researchgate: https://www.researchgate.net/profile/Yiming-Xu-13
  github: xuyimingxym
  linkedin: yimingxuuf

# Optional verification tokens for the site's search engine accounts.
google_site_verification:
bing_site_verification:

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope: {path: "", type: pages}
    values: {layout: single, author_profile: true}
  - scope: {path: "", type: teaching}
    values: {layout: single, author_profile: true, share: true}
  - scope: {path: "", type: publications}
    values: {layout: single, author_profile: true, share: true}
  - scope: {path: "", type: talks}
    values: {layout: talk, author_profile: true, share: true}

permalink: /:categories/:title/
future: false
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

include:
  - _pages
  - files
exclude:
  - README.md
  - LICENSE
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - markdown_generator
  - assets/js/_main.js
  - assets/js/plugins
  - node_modules
  - package.json
  - package-lock.json
  - local
  - tmp
  - vendor
  - .bundle
  - .sass-cache
  - .github

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap
  - jemoji
compress_html:
  clippings: all
  ignore:
    envs: development
